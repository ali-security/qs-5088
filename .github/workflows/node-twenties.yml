name: 'Tests: node.js >= 20'

on: [pull_request, push]

permissions:
  contents: read

jobs:
  tests:
    uses: ljharb/actions/.github/workflows/node.yml@ae1f8642186091037ed43bc02e9cb669d3f3dc2d
    with:
      range: '>= 20'
      type: minors
      command: npm run tests-only

  node:
    name: node >= 20
    needs: [tests]
    runs-on: ubuntu-24.04
    steps:
      - run: true
